[project]
name = "unitree-mujoco"
version = "0.1.0"
description = "Unitree MuJoCo simulation with sport RPC server"
requires-python = ">=3.11"
dependencies = [
    "mujoco>=3.6.0",
    "numpy",
    "opencv-python",
    "torch",
    "pyyaml",
    "unitree-sdk2py",
]

[project.scripts]
sport-mujoco = "unitree_mujoco.sport_mujoco:main"

[tool.setuptools]
package-dir = {"unitree_mujoco" = "simulate_python"}
packages = ["unitree_mujoco"]

[tool.setuptools.package-data]
unitree_mujoco = [
    "wtw/**/*",
    "policies/**/*",
]

# unitree_robots/ (meshes, XMLs) is resolved at runtime via __file__-relative
# paths in config.py and sport_mujoco.py.  For editable / path installs this
# works as-is.  For non-editable installs from git, add a MANIFEST.in that
# includes unitree_robots/.
